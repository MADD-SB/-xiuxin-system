<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a09" />
    <title>修心系统</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080a09;
        --panel: #101411;
        --panel-2: #141914;
        --line: rgba(255, 255, 255, 0.1);
        --muted: #8f968d;
        --text: #f3f4ef;
        --soft: #c8cec4;
        --green: #6ee7b7;
        --green-2: #145c3e;
        --gold: #f5c86a;
        --red: #fb7185;
        --blue: #7dd3fc;
        --shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Microsoft YaHei",
          "PingFang SC",
          sans-serif;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.28);
        color: var(--text);
        outline: none;
      }

      input,
      select {
        min-height: 42px;
        padding: 0 12px;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
        padding: 12px;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: rgba(110, 231, 183, 0.65);
      }

      input[type="checkbox"] {
        width: 16px;
        min-height: 16px;
        accent-color: var(--green);
      }

      input[type="range"] {
        padding: 0;
        accent-color: var(--green);
      }

      ::selection {
        background: rgba(245, 200, 106, 0.35);
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.04);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(110, 231, 183, 0.28);
        border: 2px solid rgba(0, 0, 0, 0.45);
        border-radius: 999px;
      }

      .shell {
        min-height: 100vh;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 280px);
      }

      .layout {
        display: flex;
        width: 100%;
        max-width: 1440px;
        min-height: 100vh;
        margin: 0 auto;
      }

      .sidebar {
        position: sticky;
        top: 0;
        width: 284px;
        height: 100vh;
        flex: 0 0 284px;
        border-right: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.25);
        padding: 24px 20px;
      }

      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgba(110, 231, 183, 0.32);
        border-radius: 8px;
        background: rgba(16, 185, 129, 0.12);
        color: var(--green);
        font-weight: 800;
      }

      .brand-title {
        font-size: 18px;
        font-weight: 800;
      }

      .brand-sub {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .side-score {
        margin-top: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
        padding: 16px;
      }

      .nav {
        display: grid;
        gap: 8px;
        margin-top: 28px;
      }

      .nav-btn,
      .mobile-nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        padding: 12px;
        text-align: left;
      }

      .nav-btn.active,
      .mobile-nav button.active {
        border-color: rgba(110, 231, 183, 0.35);
        background: rgba(16, 185, 129, 0.15);
        color: #e9fff7;
      }

      .nav-btn:hover,
      .mobile-nav button:hover {
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
      }

      .content {
        min-width: 0;
        flex: 1;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(8, 10, 9, 0.92);
        backdrop-filter: blur(16px);
        padding: 14px 32px;
      }

      .top-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .kicker {
        color: rgba(110, 231, 183, 0.75);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        margin-top: 4px;
        font-size: 28px;
        line-height: 1.15;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .mobile-nav {
        display: none;
        gap: 8px;
        margin-top: 14px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .mobile-nav button {
        flex: 0 0 auto;
        padding: 10px 12px;
      }

      main {
        padding: 24px 32px 40px;
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .split {
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
      }

      .split-even {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      .section {
        margin-top: 24px;
      }

      .card,
      .stat,
      .notice {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(16, 20, 17, 0.88);
        box-shadow: var(--shadow);
      }

      .card {
        padding: 16px;
      }

      .card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .card-title {
        margin-top: 4px;
        font-size: 17px;
        font-weight: 800;
      }

      .stat {
        padding: 16px;
        min-height: 126px;
      }

      .stat-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 14px;
      }

      .stat-value {
        margin-top: 14px;
        font-size: 34px;
        font-weight: 900;
        line-height: 1;
      }

      .stat-sub {
        margin-top: 8px;
        color: var(--soft);
        font-size: 14px;
      }

      .tone-red {
        border-color: rgba(251, 113, 133, 0.28);
        background: rgba(127, 29, 29, 0.18);
      }

      .tone-gold {
        border-color: rgba(245, 200, 106, 0.28);
        background: rgba(113, 63, 18, 0.18);
      }

      .tone-green {
        border-color: rgba(110, 231, 183, 0.28);
        background: rgba(20, 83, 45, 0.16);
      }

      .tone-blue {
        border-color: rgba(125, 211, 252, 0.25);
        background: rgba(8, 47, 73, 0.18);
      }

      .notice {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
        padding: 14px 16px;
        font-size: 14px;
        box-shadow: none;
      }

      .notice.warn {
        border-color: rgba(245, 200, 106, 0.32);
        background: rgba(113, 63, 18, 0.2);
        color: #fdecc8;
      }

      .notice.danger {
        border-color: rgba(251, 113, 133, 0.32);
        background: rgba(127, 29, 29, 0.2);
        color: #ffe4e6;
      }

      .notice.success {
        border-color: rgba(110, 231, 183, 0.32);
        background: rgba(20, 83, 45, 0.2);
        color: #d9fff0;
      }

      .bar {
        width: 100%;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.38);
      }

      .bar > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--green);
      }

      .bar.gold > span {
        background: var(--gold);
      }

      .score-box,
      .info-box,
      .field-box,
      .history-item {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.2);
        padding: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field > span,
      .field-label {
        color: var(--soft);
        font-size: 14px;
      }

      .btn,
      .icon-btn,
      .chip {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--soft);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 12px;
        font-weight: 700;
      }

      .btn.primary {
        border-color: rgba(110, 231, 183, 0.4);
        background: rgba(16, 185, 129, 0.15);
        color: #dbfff2;
      }

      .btn.gold {
        border-color: rgba(245, 200, 106, 0.4);
        background: rgba(245, 200, 106, 0.14);
        color: #ffefc7;
      }

      .btn.danger {
        border-color: rgba(251, 113, 133, 0.42);
        background: rgba(251, 113, 133, 0.14);
        color: #ffe4e6;
      }

      .btn:hover,
      .icon-btn:hover,
      .chip:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }

      .icon-btn {
        display: inline-grid;
        width: 38px;
        height: 38px;
        place-items: center;
      }

      .chip-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        min-height: 36px;
        padding: 0 12px;
      }

      .chip.active {
        border-color: rgba(110, 231, 183, 0.45);
        background: rgba(16, 185, 129, 0.15);
        color: #dfffee;
      }

      .task-row {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 12px;
        align-items: center;
      }

      .task-row label,
      .checkline {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        color: var(--soft);
        font-size: 14px;
      }

      .checkline {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.2);
        padding: 12px;
      }

      .muted {
        color: var(--muted);
      }

      .small {
        font-size: 12px;
      }

      .lead {
        font-size: 24px;
        font-weight: 900;
        line-height: 1.28;
      }

      .rows {
        display: grid;
        gap: 12px;
      }

      .item-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toast {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 30;
        border: 1px solid rgba(110, 231, 183, 0.35);
        border-radius: 8px;
        background: #103226;
        color: #dcfff1;
        padding: 12px 14px;
        box-shadow: var(--shadow);
        font-size: 14px;
      }

      .data-panel {
        position: absolute;
        top: 54px;
        right: 0;
        z-index: 20;
        width: min(360px, calc(100vw - 32px));
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
        box-shadow: var(--shadow);
      }

      .chart {
        width: 100%;
        height: 180px;
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 28px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }

      .table-card {
        display: grid;
        gap: 12px;
      }

      @media (max-width: 1100px) {
        .grid-4,
        .grid-3,
        .split,
        .split-even {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 860px) {
        .layout {
          display: block;
        }

        .sidebar {
          display: none;
        }

        .topbar {
          padding: 14px 16px;
        }

        .mobile-nav {
          display: flex;
        }

        main {
          padding: 24px 16px 36px;
        }

        .grid-4,
        .grid-3,
        .grid-2,
        .split,
        .split-even {
          grid-template-columns: 1fr;
        }

        .top-actions .level-pill {
          display: none;
        }

        h1 {
          font-size: 24px;
        }

        .lead {
          font-size: 22px;
        }
      }

      @media (max-width: 560px) {
        .task-row {
          grid-template-columns: 1fr;
        }

        .stat-value {
          font-size: 32px;
        }

        .card-head,
        .item-head {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="shell"></div>
    <script>

      const blankScores = () => ({ emotion: 0, focus: 0, desire: 0, output: 0 });
      const clone = (value) => JSON.parse(JSON.stringify(value));
      const todayKey = () => formatDate(new Date());
      const uid = (prefix) => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
      const clamp = (value, fallback = "未填写") => String(value || "").trim() || fallback;

      function formatDate(date) {
        const d = date instanceof Date ? date : new Date(date);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function addDays(dateKey, offset) {
        const d = new Date(`${dateKey}T00:00:00`);
        d.setDate(d.getDate() + offset);
        return formatDate(d);
      }

      function createBlankPlan(date) {
        return {
          date,
          tasks: {
            training: { label: "今日训练任务", text: "", done: false },
            learning: { label: "今日学习任务", text: "", done: false },
            output: { label: "今日输出任务", text: "", done: false },
          },
          interference: [],
          customInterference: "",
        };
      }

      function createBlankReview(date) {
        return {
          id: "",
          date,
          event: "",
          intensity: 5,
          bodyReactions: [],
          customBodyReaction: "",
          realDesires: [],
          customRealDesire: "",
          lowReactions: [],
          customLowReaction: "",
          highReactions: [],
          customHighReaction: "",
          scores: blankScores(),
          harshWords: "",
          tomorrowRule: "",
          highIntensityNoLowReaction: false,
          outputCompleted: false,
          lateNight: false,
          emotionAffectedWork: false,
          createdAt: "",
          updatedAt: "",
        };
      }

      const createBlankDesire = () => ({ id: "", name: "", behavior: "", risk: "", rule: "" });
      const createBlankReaction = () => ({ id: "", trigger: "", low: "", high: "", scene: "", mastered: false });
      const createBlankRule = () => ({ id: "", name: "", content: "", trigger: "", punishment: "", reward: "", status: "启用" });
      const createBlankWeeklyReview = (weekDate) => ({
        id: "",
        weekDate,
        controlledBy: [],
        worst: { time: "", event: "", emotion: "", lowReaction: "", consequence: "", nextRule: "" },
        restraint: { wanted: "", action: "", result: "" },
        outputs: { training: false, learning: false, money: false, content: false, expression: false },
        nextCoreRule: "",
        weekLeak: "",
        nextCultivation: "",
        createdAt: "",
        updatedAt: "",
      });

      function createDefaultState() {
        const today = todayKey();
        return {
          version: 2,
          dailyPlans: { [today]: createBlankPlan(today) },
          dailyReviews: [],
          desires: clone(defaultDesires),
          desireLogs: {},
          advancedReactions: clone(defaultAdvancedReactions),
          rules: clone(defaultRules),
          ruleLogs: {},
          weeklyReviews: [],
        };
      }

      function migrateState(raw) {
        const defaults = createDefaultState();
        const state = raw && typeof raw === "object" ? { ...defaults, ...raw } : defaults;
        state.dailyPlans = state.dailyPlans || defaults.dailyPlans;
        state.dailyReviews = Array.isArray(state.dailyReviews) ? state.dailyReviews : [];
        state.desires = Array.isArray(state.desires) && state.desires.length ? state.desires : defaults.desires;
        state.desireLogs = state.desireLogs || {};
        state.advancedReactions = Array.isArray(state.advancedReactions) && state.advancedReactions.length ? state.advancedReactions : defaults.advancedReactions;
        state.rules = Array.isArray(state.rules) && state.rules.length ? state.rules : defaults.rules;
        state.ruleLogs = state.ruleLogs || {};
        state.weeklyReviews = Array.isArray(state.weeklyReviews) ? state.weeklyReviews : [];
        if (!state.dailyPlans[todayKey()]) state.dailyPlans[todayKey()] = createBlankPlan(todayKey());
        return state;
      }

      function readState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
          return migrateState(raw ? JSON.parse(raw) : null);
        } catch (error) {
          console.warn("读取本地数据失败，已使用默认状态。", error);
          return createDefaultState();
        }
      }

      let state = readState();
      let active = "today";
      let showData = false;
      let toastTimer = 0;
      let notice = "";
      let drafts = {
        review: createBlankReview(todayKey()),
        desire: createBlankDesire(),
        reaction: createBlankReaction(),
        rule: createBlankRule(),
        weekly: createBlankWeeklyReview(todayKey()),
        filterDate: todayKey(),
        desireDate: todayKey(),
        ruleDate: todayKey(),
      };

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function flash(message) {
        notice = message || "";
        clearTimeout(toastTimer);
        if (notice) toastTimer = setTimeout(() => { notice = ""; render(); }, 1600);
      }

      function commit(message) {
        saveState();
        flash(message);
        render();
      }

      function sumScores(scores = {}) {
        return scoreItems.reduce((sum, [key]) => sum + Number(scores[key] || 0), 0);
      }

      function getTodayLevel(total) {
        return todayLevels.find(([min, max]) => total >= min && total <= max) || todayLevels[0];
      }

      function weakestScore(scores = {}) {
        return [...scoreItems].sort((a, b) => Number(scores[a[0]] || 0) - Number(scores[b[0]] || 0))[0][0];
      }

      function completedBigTasks(plan) {
        return !!plan && ["training", "learning", "output"].every((key) => plan.tasks?.[key]?.done);
      }

      function outputDone(plan, review) {
        return !!(plan?.tasks?.output?.done || review?.outputCompleted);
      }

      function newestByDate(items) {
        return [...(items || [])].sort((a, b) => String(b.date || b.weekDate).localeCompare(String(a.date || a.weekDate)));
      }

      function reviewStreak(base = todayKey()) {
        const dates = new Set(state.dailyReviews.map((item) => item.date));
        let count = 0;
        let cursor = base;
        while (dates.has(cursor)) {
          count += 1;
          cursor = addDays(cursor, -1);
        }
        return count;
      }

      function noReviewDays(base = todayKey()) {
        if (!state.dailyReviews.length) return 9999;
        const latest = newestByDate(state.dailyReviews)[0]?.date;
        return Math.max(0, Math.round((new Date(`${base}T00:00:00`) - new Date(`${latest}T00:00:00`)) / 86400000));
      }

      function keptRuleStreak(base = todayKey()) {
        let count = 0;
        let cursor = base;
        while (true) {
          const logs = Object.values(state.ruleLogs[cursor] || {});
          if (!logs.includes("kept") || logs.includes("broken")) break;
          count += 1;
          cursor = addDays(cursor, -1);
        }
        return count;
      }

      function keptDesireStreak(id, base = todayKey()) {
        let count = 0;
        let cursor = base;
        while (state.desireLogs[cursor]?.[id] === "kept") {
          count += 1;
          cursor = addDays(cursor, -1);
        }
        return count;
      }

      function monthlyBreakCount(base = todayKey()) {
        const month = base.slice(0, 7);
        const countLogs = (logs) =>
          Object.entries(logs || {}).reduce((sum, [date, dayLogs]) => {
            if (date.slice(0, 7) !== month) return sum;
            return sum + Object.values(dayLogs || {}).filter((value) => value === "broken").length;
          }, 0);
        return countLogs(state.desireLogs) + countLogs(state.ruleLogs);
      }

      function calculatePoints() {
        const reviewsByDate = new Map(state.dailyReviews.map((item) => [item.date, item]));
        const dates = new Set([...Object.keys(state.dailyPlans || {}), ...state.dailyReviews.map((item) => item.date)]);
        let total = 0;
        const detail = [];

        state.dailyReviews.forEach((review) => {
          total += 10;
          detail.push({ date: review.date, label: "完成每日复盘", points: 10 });
          if (Number(review.intensity) > 7 && review.highIntensityNoLowReaction) {
            total += 30;
            detail.push({ date: review.date, label: "高强度情绪下守住反应", points: 30 });
          }
          if (review.lateNight) {
            total -= 15;
            detail.push({ date: review.date, label: "熬夜一次", points: -15 });
          }
          if (review.emotionAffectedWork) {
            total -= 15;
            detail.push({ date: review.date, label: "情绪影响训练/学习", points: -15 });
          }
        });

        dates.forEach((date) => {
          const plan = state.dailyPlans[date];
          const review = reviewsByDate.get(date);
          if (completedBigTasks(plan)) {
            total += 20;
            detail.push({ date, label: "完成今日三件大事", points: 20 });
          }
          if (outputDone(plan, review)) {
            total += 15;
            detail.push({ date, label: "发布内容/完成输出", points: 15 });
          }
        });

        Object.entries(state.ruleLogs || {}).forEach(([date, logs]) => {
          Object.values(logs || {}).forEach((value) => {
            if (value === "kept") {
              total += 10;
              detail.push({ date, label: "守住一条规则", points: 10 });
            }
            if (value === "broken") {
              total -= 20;
              detail.push({ date, label: "破戒一次", points: -20 });
            }
          });
        });

        Object.entries(state.desireLogs || {}).forEach(([date, logs]) => {
          Object.values(logs || {}).forEach((value) => {
            if (value === "broken") {
              total -= 20;
              detail.push({ date, label: "欲望破戒一次", points: -20 });
            }
          });
        });

        total = Math.max(0, total);
        const current = [...pointLevels].reverse().find((item) => total >= item[2]) || pointLevels[0];
        const next = pointLevels.find((item) => item[2] > current[2]);
        const progress = next ? Math.round(((total - current[2]) / (next[2] - current[2])) * 100) : 100;
        return {
          total,
          current,
          next,
          progress: Math.max(0, Math.min(100, progress)),
          recent: newestByDate(detail).slice(0, 8),
          reviewStreak: reviewStreak(),
          ruleStreak: keptRuleStreak(),
          breakCount: monthlyBreakCount(),
        };
      }

      function chartSeries(days = 14) {
        const reviews = new Map(state.dailyReviews.map((item) => [item.date, item]));
        const today = todayKey();
        return Array.from({ length: days }, (_, index) => {
          const date = addDays(today, index - days + 1);
          const scores = reviews.get(date)?.scores || {};
          return {
            date,
            total: sumScores(scores),
            emotion: Number(scores.emotion || 0),
            desire: Number(scores.desire || 0),
          };
        });
      }

      function setDeep(target, path, value) {
        const parts = path.split(".");
        let cursor = target;
        parts.slice(0, -1).forEach((part) => (cursor = cursor[part]));
        cursor[parts.at(-1)] = value;
      }

      function getDeep(target, path) {
        return path.split(".").reduce((cursor, part) => cursor?.[part], target);
      }

      function toggleArrayItem(array, value) {
        return array.includes(value) ? array.filter((item) => item !== value) : [...array, value];
      }

      function navHtml() {
        return navItems.map(([id, icon, label]) => `
          <button class="nav-btn ${active === id ? "active" : ""}" onclick="app.setActive('${id}')">
            <span>${icon}</span><span>${label}</span>
          </button>`).join("");
      }

      function mobileNavHtml() {
        return navItems.map(([id, icon, label]) => `
          <button class="${active === id ? "active" : ""}" onclick="app.setActive('${id}')">
            <span>${icon}</span><span>${label}</span>
          </button>`).join("");
      }

      function bar(value, tone = "") {
        return `<div class="bar ${tone}"><span style="width:${Math.max(0, Math.min(100, value))}%"></span></div>`;
      }

      function stat(label, value, sub, tone = "") {
        return `<div class="stat ${tone ? `tone-${tone}` : ""}">
          <div class="stat-label"><span>${esc(label)}</span><span>⌁</span></div>
          <div class="stat-value">${esc(value)}</div>
          <div class="stat-sub">${esc(sub || "")}</div>
        </div>`;
      }

      function card(title, kicker, body, action = "") {
        return `<section class="card">
          <div class="card-head">
            <div>${kicker ? `<div class="kicker">${esc(kicker)}</div>` : ""}<h2 class="card-title">${esc(title)}</h2></div>
            ${action}
          </div>
          ${body}
        </section>`;
      }

      function field(label, inner) {
        return `<label class="field"><span>${esc(label)}</span>${inner}</label>`;
      }

      function textInput(value, handler, placeholder = "", type = "text") {
        return `<input type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" oninput="${handler}">`;
      }

      function textArea(value, handler, placeholder = "") {
        return `<textarea placeholder="${esc(placeholder)}" oninput="${handler}">${esc(value)}</textarea>`;
      }

      function chips(options, selected, handler) {
        return `<div class="chip-wrap">${options.map((option) => `
          <button type="button" class="chip ${(selected || []).includes(option) ? "active" : ""}" onclick="${handler.replace("__VALUE__", esc(option))}">${esc(option)}</button>
        `).join("")}</div>`;
      }

      function checkLine(checked, handler, label, sub = "") {
        return `<label class="checkline">
          <input type="checkbox" ${checked ? "checked" : ""} onchange="${handler}">
          <span><strong>${esc(label)}</strong>${sub ? `<br><span class="muted small">${esc(sub)}</span>` : ""}</span>
        </label>`;
      }

      function scoreSliders(scores, handlerPrefix) {
        return `<div class="grid grid-2">${scoreItems.map(([key, label, max]) => {
          const value = Number(scores[key] || 0);
          return `<div class="score-box">
            <div class="item-head"><span>${label}</span><strong>${value}/${max}</strong></div>
            <input type="range" min="0" max="${max}" value="${value}" oninput="${handlerPrefix}('${key}', Number(this.value))">
          </div>`;
        }).join("")}</div>`;
      }

      function renderToday(points) {
        const today = todayKey();
        if (!state.dailyPlans[today]) state.dailyPlans[today] = createBlankPlan(today);
        const plan = state.dailyPlans[today];
        const review = state.dailyReviews.find((item) => item.date === today);
        const scores = review?.scores || blankScores();
        const total = review ? sumScores(scores) : 0;
        const level = getTodayLevel(total);
        const reminder = review ? scoreReminders[weakestScore(scores)] : "今日心未校准。先完成一次复盘，再判断今天的心性等级。";
        const quote = systemQuotes[Number(today.replaceAll("-", "")) % systemQuotes.length];
        const escaping = state.dailyReviews.length > 0 && noReviewDays() >= 3;

        const scoreBody = `<div class="grid grid-2">${scoreItems.map(([key, label]) => {
          const value = Number(scores[key] || 0);
          return `<div class="score-box">
            <div class="item-head"><span>${label}</span><strong>${value}/25</strong></div>
            ${bar((value / 25) * 100)}
          </div>`;
        }).join("")}</div>
        <div class="score-box tone-gold" style="margin-top:16px">
          <div class="kicker">今日提醒语</div>
          <p style="margin-top:8px;font-size:18px;font-weight:800;line-height:1.6">${esc(reminder)}</p>
        </div>`;

        const taskRows = Object.entries(plan.tasks).map(([key, task]) => `<div class="field-box task-row">
          <label><input type="checkbox" ${task.done ? "checked" : ""} onchange="app.updatePlanTask('${key}','done',this.checked,true)"> ${esc(task.label)}</label>
          ${textInput(task.text, `app.updatePlanTask('${key}','text',this.value,false)`, key === "training" ? "例：力量训练45分钟" : key === "learning" ? "例：刷题30道并整理错题" : "例：发布一条内容/完成作品")}
        </div>`).join("");

        const pointsBody = points.recent.length
          ? `<div class="grid grid-2">${points.recent.map((item) => `<div class="info-box item-head">
              <span>${esc(item.date)} · ${esc(item.label)}</span>
              <strong style="color:${item.points >= 0 ? "var(--green)" : "var(--red)"}">${item.points > 0 ? "+" : ""}${item.points}</strong>
            </div>`).join("")}</div>`
          : `<div class="empty">暂无积分记录，完成复盘后这里会开始亮起来。</div>`;

        return `<div class="stack">
          <div class="grid grid-4">
            ${stat("今日修心等级", level[2], review ? `${total}/100` : "未校准", level[3])}
            ${stat("今日总分", total, "四项能力合计", "blue")}
            ${stat("连续复盘", points.reviewStreak, escaping ? "正在逃避校准" : "天")}
            ${stat("积分等级", points.current[0], points.next ? `距 ${points.next[0]} 还差 ${points.next[2] - points.total}` : "已到最高等级", "gold")}
          </div>
          <div class="grid split">
            ${card("今日核心状态", "Daily State", scoreBody)}
            ${card("系统文案", "Signal", `<div class="lead">${esc(quote)}</div><div style="margin-top:48px"><div class="item-head small muted"><span>${esc(points.current[1])}</span><span>${points.progress}%</span></div>${bar(points.progress, "gold")}</div>`)}
          </div>
          <div class="grid split-even">
            ${card("今日三件大事", "Mission", `<div class="rows">${taskRows}</div><div class="info-box muted" style="margin-top:16px">${completedBigTasks(plan) ? "三件大事已完成，今日执行有根。" : "先把任务落地，别让情绪替你安排一天。"}</div>`, `<button class="btn primary" onclick="app.saveOnly()">保存</button>`)}
            ${card("今日干扰源", "Interference", `${chips(interferenceOptions, plan.interference, "app.togglePlanInterference('__VALUE__')")}<div style="margin-top:16px">${field("自定义干扰源", textInput(plan.customInterference, "app.updatePlanCustom(this.value)", "写下今天最容易拿走你注意力的东西"))}</div><div class="actions" style="margin-top:16px"><button class="btn gold" onclick="app.setActive('review')">去做今晚复盘</button><button class="btn primary" onclick="app.setActive('rules')">打卡规则</button></div>`)}
          </div>
          ${card("近期积分记录", "Points", pointsBody)}
        </div>`;
      }

      function selectionBlock(title, options, fieldName, customField) {
        const form = drafts.review;
        return `<div class="field-box">
          <div class="field-label" style="margin-bottom:10px">${esc(title)}</div>
          ${chips(options, form[fieldName], `app.toggleReviewArray('${fieldName}','__VALUE__')`)}
          <div style="margin-top:12px">${textInput(form[customField], `app.updateDraft('review','${customField}',this.value,false)`, "自定义补充")}</div>
        </div>`;
      }

      function renderReview() {
        const form = drafts.review;
        const reviews = newestByDate(state.dailyReviews);
        const filtered = drafts.filterDate ? reviews.filter((item) => item.date === drafts.filterDate) : reviews;
        const history = filtered.length
          ? filtered.map((item) => `<div class="history-item">
              <div class="item-head">
                <div><div class="muted small">${esc(item.date)}</div><h3>${sumScores(item.scores)} 分</h3></div>
                <div class="actions"><button class="icon-btn" onclick="app.editReview('${item.id}')">✎</button><button class="icon-btn" onclick="app.deleteReview('${item.id}')">×</button></div>
              </div>
              <p style="margin-top:12px;line-height:1.7">${esc(clamp(item.event, "未记录情绪事件"))}</p>
              <p class="muted small" style="margin-top:10px">漏洞：${esc(clamp(item.harshWords))}</p>
              <p class="muted small">明日规则：${esc(clamp(item.tomorrowRule))}</p>
            </div>`).join("")
          : `<div class="empty">没有找到这一天的复盘记录。</div>`;

        const formBody = `
          <div class="grid grid-2">
            ${field("日期", textInput(form.date, "app.updateDraft('review','date',this.value,false)", "", "date"))}
            ${field(`情绪强度：${form.intensity}/10`, `<input type="range" min="1" max="10" value="${form.intensity}" oninput="app.updateDraft('review','intensity',Number(this.value),true)">`)}
          </div>
          <div style="margin-top:16px">${field("今日最大情绪波动事件", textArea(form.event, "app.updateDraft('review','event',this.value,false)", "发生了什么？谁或什么刺激到了你？"))}</div>
          <div class="rows" style="margin-top:16px">
            ${selectionBlock("当时身体反应", bodyReactionOptions, "bodyReactions", "customBodyReaction")}
            ${selectionBlock("我的真实欲望", desireOptions, "realDesires", "customRealDesire")}
            ${selectionBlock("我的低级反应", lowReactionOptions, "lowReactions", "customLowReaction")}
            ${selectionBlock("更高级的替代反应", highReactionOptions, "highReactions", "customHighReaction")}
          </div>
          <h3 style="margin-top:20px;margin-bottom:12px">今日四项评分</h3>
          ${scoreSliders(form.scores, "app.updateReviewScore")}
          <div class="grid grid-2" style="margin-top:16px">
            ${field("今日一句狠话", textArea(form.harshWords, "app.updateDraft('review','harshWords',this.value,false)", "我今天最大的漏洞是：____"))}
            ${field("明日一条规则", textArea(form.tomorrowRule, "app.updateDraft('review','tomorrowRule',this.value,false)", "明天我必须做到：____"))}
          </div>
          <div class="grid grid-2" style="margin-top:16px">
            ${checkLine(form.highIntensityNoLowReaction, "app.updateDraft('review','highIntensityNoLowReaction',this.checked,true)", "情绪强度超过7但没有做低级反应", "+30 修心积分")}
            ${checkLine(form.outputCompleted, "app.updateDraft('review','outputCompleted',this.checked,true)", "发布内容 / 完成输出", "+15 修心积分")}
            ${checkLine(form.lateNight, "app.updateDraft('review','lateNight',this.checked,true)", "熬夜一次", "-15 修心积分")}
            ${checkLine(form.emotionAffectedWork, "app.updateDraft('review','emotionAffectedWork',this.checked,true)", "因情绪影响训练/学习", "-15 修心积分")}
          </div>`;

        return `<div class="grid split">
          ${card("每日情绪复盘", "Night Audit", formBody, `<div class="actions"><button class="icon-btn" onclick="app.resetReview()">↻</button><button class="btn primary" onclick="app.saveReview()">保存复盘</button></div>`)}
          ${card("复盘历史", "History", `<div class="actions" style="margin-bottom:12px"><input type="date" value="${esc(drafts.filterDate)}" onchange="app.setFilterDate(this.value)"><button class="icon-btn" onclick="app.setFilterDate('')">×</button></div><div class="rows">${history}</div>`)}
        </div>`;
      }

      function renderDesire() {
        const f = drafts.desire;
        const date = drafts.desireDate;
        const form = `<div class="rows">
          ${field("欲望名称", textInput(f.name, "app.updateDraft('desire','name',this.value,false)", "例：异性认可 / 面子 / 短视频"))}

      function miniChart(title, data, metric, max, color) {
        const width = 360, height = 160, px = 24, top = 18, bottom = 126, usable = width - px * 2;
        const points = data.map((item, index) => {
          const x = px + (data.length === 1 ? 0 : (usable / (data.length - 1)) * index);
          const y = bottom - (Number(item[metric] || 0) / max) * (bottom - top);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(" ");
        const dots = data.map((item, index) => {
          const x = px + (data.length === 1 ? 0 : (usable / (data.length - 1)) * index);
          const y = bottom - (Number(item[metric] || 0) / max) * (bottom - top);
          return `<circle cx="${x}" cy="${y}" r="3" fill="${color}"></circle>`;
        }).join("");
        return `<div class="info-box">
          <div class="item-head"><h3>${esc(title)}</h3><strong>${Number(data.at(-1)?.[metric] || 0)}</strong></div>
          <svg class="chart" viewBox="0 0 ${width} ${height}">
            <line x1="24" y1="126" x2="336" y2="126" stroke="rgba(255,255,255,.12)"></line>
            <line x1="24" y1="72" x2="336" y2="72" stroke="rgba(255,255,255,.07)"></line>
            <line x1="24" y1="18" x2="336" y2="18" stroke="rgba(255,255,255,.07)"></line>
            <polyline points="${points}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>
            ${dots}
          </svg>
          <div class="item-head muted small"><span>${esc(data[0]?.date.slice(5) || "")}</span><span>${esc(data.at(-1)?.date.slice(5) || "")}</span></div>
        </div>`;
      }

      window.app = {
        setActive(id) { active = id; showData = false; render(); },
        toggleDataTools() { showData = !showData; render(); },
        saveOnly() { commit("已保存"); },
        updateDraft(name, path, value, shouldRender) { setDeep(drafts[name], path, value); if (shouldRender) render(); },
        updateReviewScore(key, value) { drafts.review.scores[key] = value; render(); },
        toggleReviewArray(field, value) { drafts.review[field] = toggleArrayItem(drafts.review[field] || [], value); render(); },
        setFilterDate(value) { drafts.filterDate = value; render(); },
        updatePlanTask(key, prop, value, shouldRender) {
          const today = todayKey();
          if (!state.dailyPlans[today]) state.dailyPlans[today] = createBlankPlan(today);
          state.dailyPlans[today].tasks[key][prop] = value;
          saveState();
          if (shouldRender) render();
        },
        updatePlanCustom(value) {
          const today = todayKey();
          if (!state.dailyPlans[today]) state.dailyPlans[today] = createBlankPlan(today);
          state.dailyPlans[today].customInterference = value;
          saveState();
        },
        togglePlanInterference(value) {
          const today = todayKey();
          if (!state.dailyPlans[today]) state.dailyPlans[today] = createBlankPlan(today);
          state.dailyPlans[today].interference = toggleArrayItem(state.dailyPlans[today].interference || [], value);
          commit("干扰源已更新");
        },
        resetReview() { drafts.review = createBlankReview(todayKey()); render(); },
        saveReview() {
          const existing = state.dailyReviews.find((item) => item.id === drafts.review.id || item.date === drafts.review.date);
          const item = { ...clone(drafts.review), id: existing?.id || drafts.review.id || uid("review"), createdAt: existing?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
          state.dailyReviews = [item, ...state.dailyReviews.filter((review) => review.id !== item.id && review.date !== item.date)];
          drafts.review = clone(item);
          drafts.filterDate = item.date;
          commit("复盘已保存");
        },
        editReview(id) { const item = state.dailyReviews.find((review) => review.id === id); if (item) { drafts.review = clone(item); render(); } },
        deleteReview(id) { state.dailyReviews = state.dailyReviews.filter((item) => item.id !== id); commit("复盘已删除"); },
        resetDesire() { drafts.desire = createBlankDesire(); render(); },
        saveDesire() {
          if (!drafts.desire.name.trim()) return flash("请先填写欲望名称"), render();
          const item = { ...clone(drafts.desire), id: drafts.desire.id || uid("desire") };
          state.desires = state.desires.some((old) => old.id === item.id) ? state.desires.map((old) => old.id === item.id ? item : old) : [item, ...state.desires];
          drafts.desire = createBlankDesire();
          commit("欲望规则已保存");
        },
        editDesire(id) { const item = state.desires.find((old) => old.id === id); if (item) { drafts.desire = clone(item); render(); } },
        deleteDesire(id) { state.desires = state.desires.filter((item) => item.id !== id); commit("欲望记录已删除"); },
        setDesireDate(value) { drafts.desireDate = value; render(); },
        logDesire(id, status) {
          const date = drafts.desireDate;
          state.desireLogs[date] = { ...(state.desireLogs[date] || {}) };
          if (status) state.desireLogs[date][id] = status;
          else delete state.desireLogs[date][id];
          commit(status === "broken" ? "已记录破戒" : status === "kept" ? "已记录守住" : "打卡已清除");
        },
        resetReaction() { drafts.reaction = createBlankReaction(); render(); },
        saveReaction() {
          if (!drafts.reaction.trigger.trim()) return flash("请先填写刺激情境"), render();
          const item = { ...clone(drafts.reaction), id: drafts.reaction.id || uid("reaction") };
          state.advancedReactions = state.advancedReactions.some((old) => old.id === item.id) ? state.advancedReactions.map((old) => old.id === item.id ? item : old) : [item, ...state.advancedReactions];
          drafts.reaction = createBlankReaction();
          commit("高级反应已保存");
        },
        editReaction(id) { const item = state.advancedReactions.find((old) => old.id === id); if (item) { drafts.reaction = clone(item); render(); } },
        deleteReaction(id) { state.advancedReactions = state.advancedReactions.filter((item) => item.id !== id); commit("反应记录已删除"); },
        toggleReactionMastered(id) { state.advancedReactions = state.advancedReactions.map((item) => item.id === id ? { ...item, mastered: !item.mastered } : item); commit("掌握状态已更新"); },
        resetRule() { drafts.rule = createBlankRule(); render(); },
        saveRule() {
          if (!drafts.rule.name.trim()) return flash("请先填写规则名称"), render();
          const item = { ...clone(drafts.rule), id: drafts.rule.id || uid("rule") };
          state.rules = state.rules.some((old) => old.id === item.id) ? state.rules.map((old) => old.id === item.id ? item : old) : [item, ...state.rules];
          drafts.rule = createBlankRule();
          commit("规则已保存");
        },
        editRule(id) { const item = state.rules.find((old) => old.id === id); if (item) { drafts.rule = clone(item); render(); } },
        deleteRule(id) { state.rules = state.rules.filter((item) => item.id !== id); commit("规则已删除"); },
        setRuleDate(value) { drafts.ruleDate = value; render(); },
        logRule(id, status) {
          const date = drafts.ruleDate;
          state.ruleLogs[date] = { ...(state.ruleLogs[date] || {}) };
          if (status) state.ruleLogs[date][id] = status;
          else delete state.ruleLogs[date][id];
          commit(status === "kept" ? "规则守住已记录" : status === "broken" ? "规则违反已记录" : "打卡已清除");
        },
        toggleWeeklyControlled(value) { drafts.weekly.controlledBy = toggleArrayItem(drafts.weekly.controlledBy || [], value); render(); },
        resetWeekly() { drafts.weekly = createBlankWeeklyReview(todayKey()); render(); },
        saveWeekly() {
          const item = { ...clone(drafts.weekly), id: drafts.weekly.id || uid("week"), createdAt: drafts.weekly.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
          state.weeklyReviews = state.weeklyReviews.some((old) => old.id === item.id) ? state.weeklyReviews.map((old) => old.id === item.id ? item : old) : [item, ...state.weeklyReviews];
          drafts.weekly = createBlankWeeklyReview(todayKey());
          commit("周复盘已保存");
        },
        editWeekly(id) { const item = state.weeklyReviews.find((old) => old.id === id); if (item) { drafts.weekly = clone(item); render(); } },
        deleteWeekly(id) { state.weeklyReviews = state.weeklyReviews.filter((item) => item.id !== id); commit("周复盘已删除"); },
        exportData() {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `xiuxin-backup-${todayKey()}.json`;
          link.click();
          URL.revokeObjectURL(url);
        },
        importData() {
          const text = document.getElementById("import-json")?.value || "";
          if (!text.trim()) return flash("请先粘贴备份 JSON"), render();
          try {
            state = migrateState(JSON.parse(text));
            saveState();
            showData = false;
            flash("数据已导入");
            render();
          } catch (error) {
            flash("JSON 格式不正确");
            render();
          }
        },
      };

      render();
    </script>
  </body>
</html>
